# anmolmathur.com — site container
#
# IMPORTANT: ai.anmolmathur.com and posthog.anmolmathur.com already serve TLS,
# so something on this box is already terminating HTTPS. This compose file
# therefore does NOT start its own reverse proxy by default — it would fight
# for ports 80/443 and could take those sites down.
#
#   Default          : the app listens on 127.0.0.1:3000 only. Point your
#                      existing Caddy/nginx/Traefik at it.
#   --profile edge   : additionally starts a Caddy that owns 80/443. Use this
#                      ONLY if nothing else on the box is serving those ports.

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: anmolmathur-site:latest
    container_name: anmolmathur-site
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      # Loopback only. Nothing is exposed publicly until a proxy forwards to it.
      - "127.0.0.1:${SITE_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional. Only starts with: docker compose --profile edge up -d
  caddy:
    image: caddy:2-alpine
    container_name: anmolmathur-caddy
    profiles: [edge]
    restart: unless-stopped
    depends_on:
      site:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}

volumes:
  caddy_data:
  caddy_config:
